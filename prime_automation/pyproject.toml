[project]
name = "prime-automation"
version = "0.1.0"
description = "Prime automation: predicting the primary diagnosis code"
requires-python = "==3.10.*"
dependencies = [
    "hydra-core==1.3.1",
    "numpy==1.23.5",
    "omegaconf==2.3.0",
    "pandas==1.5.3",
    "pyarrow==11.0.0",
    "rich==13.3.1",
    "torch==1.13.1",
    "transformers==4.26.1",
]

[tool.uv]
package = false
constraint-dependencies = [
    "huggingface-hub==0.12.0",
    "tokenizers==0.13.2",
]

[dependency-groups]
dev = [
    "ruff==0.17.6",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pyright]
extraPaths = ["../prepare_data"]
